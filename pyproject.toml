[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyproof"
version = "0.1.0"
description = "Keyboard contract repair with independent browser verification and Weave evidence"
requires-python = ">=3.12"
classifiers = ["Operating System :: POSIX :: Linux"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "playwright>=1.51,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "weave>=0.52,<1",
]

[project.scripts]
keyproof = "keyproof.cli:main"

[project.urls]
Repository = "https://github.com/mottopanikeiku/keyboard-contract-repair"
Issues = "https://github.com/mottopanikeiku/keyboard-contract-repair/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/keyproof"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
